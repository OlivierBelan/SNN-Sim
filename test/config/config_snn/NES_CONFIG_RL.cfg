[Runner_Info]
# used on in SNN
run_time=5
# meaning that the snn runner will run for run_time + run_time_margin time steps
run_time_margin=3
dt = 1.0


runner_type = Reinforcement
# used in Reinforcement only
online = False

input_spike_amplitude = 100

# abs or raw or abs_scaling_1..3 or raw_scaling_1..3 or abs_scaling_dynamic_1..3 or raw_scaling_dynamic_1..3
# observation_type = raw_scaling_1
# observation_type = raw
observation_type = abs_scaling_dynamic_3

# static, dynamic_population, dynamic_elites_n%, dynamic_evolution_(abs), dynamic_population_evolution_(abs), dynamic_elites_evolution_(abs)_n% | (n% -> [0, 1] is the percentage of elite use for ajusting the action range)
action_type = static
# action_type = dynamic_evolution
# action_type = dynamic_evolution_abs
# action_type = dynamic_population
# action_type = dynamic_elites_1.0
# action_type = dynamic_population_evolution
# action_type = dynamic_population_evolution_abs
# action_type = dynamic_elite_evolution_0.50
# action_type = dynamic_elite_evolution_abs_0.50

# Set percentage limits [0, 1] of the env is full range (e.g., 0.75 * [-1, 1] (min_action, max_action) -> [-0.75, 0.75] of the full action range will be use).
# action_max_ratio =  0.05
# action_min_ratio =  0.05
action_max_ratio =  1.0
action_min_ratio =  1.0

# neuron_reset type: voltage_reset, threshold_reset
neuron_reset = voltage_reset
is_voltage_negative = True

; # BEST FOR VOLTAGE DECODING -> no output threshold + beta decay

# lif or beta
decay_method = lif

# spike_count_negative: none, input, hidden, output
spike_count_negative = input

# The layer to record (input, hidden, output)
record_layer = output
# spike or voltage or augmented
record = augmented

# poisson, binomial, exact, rate, combinatorial, latency, direct, derivative
encoder = derivative
# rate or voltage or augmented or max_spike or coeff
decoder = augmented

# LIF
neuron_model = LIF

[Derivative_Encoder]
derivative_threshold = 0.01
# rate or latency or latency_positional
derivative_type = latency_positional
derivative_max_delta_latency = 0.5
derivative_use_prev_input = True
spike_amplitude = 100

[Direct_Encoder]
direct_max = 100_000
direct_min = -100_000

[Exact_Encoder]
max_nb_spikes = 5
spike_amplitude = 100

[Poisson_Encoder]
max_nb_spikes = 7
spike_amplitude = 100
# reduce the noise - higher value = less noise
spike_rate = 20

[Binomial_Encoder]
max_nb_spikes = 5
spike_amplitude = 100
# higher value = less noise
reduce_noise = 1


[Rate_Encoder]
spike_amplitude = 100

[Latency_Encoder]
spike_amplitude = 100

[Rate_Decoder]
# (eg if run_time = 50 and nb_neurons_per_categories = 10 and ratio_max_output_spike = 0.20 
# so formula is (run_time*nb_neurons_per_categories*ratio_max_output_spike)/nb_neurons_per_categories 
# then each categorie output neuron can spike (or will be considered) 50*10*0.20 = 100 times or (50*10*0.20)/10 = 10 spikes per neuron category for 50 time steps)
ratio_max_output_spike = 1.0

[Voltage_Decoder]
disable_output_threshold = True
# can be number or threshold
voltage_max = 10.0
# can be number or voltage
voltage_min = 0.0

[Combinatorial_Encoder]
spike_amplitude = 100
# Will divide the number of combinaison by this number but will increase the number of spike per combinaison
# so improve the meaning of combinaison but decrease the number of combinaison
# number of comibinaison is -> 2^(run_time/combinatorial_factor)[:combinatorial_combinaison_size]
# has to be integer and > 0
combinatorial_factor = 1
combinatorial_combinaison_size_max=32
combinatorial_combinaison_size=32
combinatorial_combinaison_noise=0.0
combinatorial_combinaison_noise_decay=0.0
combinatorial_roll = True

# binary or energy or modulo_static or modulo_dynamic or modulo_energy_static or modulo_energy_dynamic, modulo_static_dynamic or modulo_energy_static_dynamic or number_ones or modulo_number_ones_static or modulo_number_ones_dynamic or modulo_number_ones_static_dynamic
# combinatorial_filter = binary
# combinatorial_filter = energy
# combinatorial_filter = modulo_static
combinatorial_filter = number_ones
# combinatorial_filter = modulo_number_ones_static
# combinatorial_filter = modulo_dynamic_static
# combinatorial_filter = modulo_energy_static_dynamic
# has to be >= 1.0; used only with modulo_energy_static
combinatorial_modulo = 1.0
# a noise value which ocillate between -1 and 1 and added to the modulo value
combinatorial_ocillator_noise = 0.000
combinatorial_ocillator_noise_decay = 0.0
combinatorial_print_table_debug = False

[Augmented_Decoder]
spike_max = 200
spike_distribution_run = 170
spike_distribution_importance = 100
# spike_max = 4000
# spike_distribution_run = 3200
# spike_distribution_importance = 1700
# If True augmented on All neurons, if False only on Output neurons
is_all_neurons_to_decode = True
# If True, update the voltage with the augmented spike value; otherwise, use the original spike value
is_neurons_update_with_augmented = False
# is_neurons_update_with_augmented = True
# Reset voltage to 0 if the neuron spiked; otherwise, keep the excess voltage above the threshold
is_voltage_reset = True
# normalize the spike distribution between 0 and 1 -> np.clip((nb_spikes/spike_max), 0, 1)
is_normalize = True
# interpolate the spike distribution between min and max
is_interpolate = False
interpolate_max = 1.0
interpolate_min = 0.0
# positive, absolute, raw (positive and negative)
spike_type = positive
# first_index, by_index, nothing 
importance_type = by_index
# ascending, descending
linear_spike_importance_type = descending


[NEURO_EVOLUTION]
# True or False or minimal
verbose = True
# maximize, minimize or closest_to_zero
optimization_type = maximize
algo_name = NES-evosax

[Record]
criteria=best_episode_raw_score mean_episode_raw_score
sorted_by=best_episode_raw_score

[Genome_NN]
inputs = 17
# hiddens = H1:32, H2:32
hiddens = H1:32
outputs = 6
inputs_multiplicator = 1
hiddens_multiplicator = 1
outputs_multiplicator = 1

is_self_neuron_connection = True

# architecture = I->H1, H1->O
architecture = I->H1, H1->O, I->O
# architecture = I->H1, H1->H2, H2->O
# architecture = I->H1, H1->H2, H2->H3, H3->O
# architecture = I->H1, I->O, H1->H1, H1->O, O->H1, O->O
# architecture = I->I, I->H1, I->O, H1->I, H1->H1, H1->O, O->I, O->H1, O->O
# architecture = I->H1, I->H2, I->O, I->I, H1->O, H1->H1, H1->H2, H1->I, H2->O, H2->H1, H2->H2, H2->I, O->O, O->I, O->H1, O->H2
network_type = SNN
is_dynamic_topology = False


[NES]
pop_size = 128
