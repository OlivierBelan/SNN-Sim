[Runner_Info]
run_time=4
# meaning that the snn runner will run for run_time + run_time_margin time steps
run_time_margin=3
dt=1.0

runner_type = Supervised
batch_population=128
# number of features from the data set used per run
batch_features=178
# has to smaller than batch_features other wise it will be set to batch_features
# is the number of features used during the run loop
batch_running=178

input_spike_amplitude = 100

# neuron_reset type: voltage_reset, threshold_reset
neuron_reset = voltage_reset

; # BEST FOR VOLTAGE DECODING -> no output threshold + beta decay

# lif or beta
decay_method = lif

is_voltage_negative = False
spike_count_negative = input

# The layer to record (input, hidden, output)
record_layer = output
# spike or voltage or augmented
record = augmented

# poisson, binomial, exact, rate, combinatorial, latency, direct (and soon burst)
encoder = combinatorial

# rate or voltage or augmented or max_spike or coeff
decoder = augmented

# LIF, LIF_energy, LIF_sinusoidal, LIF_fourier, LIF_energy_sinusoidal, LIF_energy_fourier
neuron_model = LIF
# neuron_model = LIF_energy
# neuron_model = LIF_energy_sinusoidal
# neuron_model = LIF_energy_fourier
# neuron_model = LIF_fourier
# neuron_model = LIF_sinusoidal

[Direct_Encoder]
direct_max = 100_000
direct_min = -100_000

[Exact_Encoder]
max_nb_spikes = 2
spike_amplitude = 100

[Poisson_Encoder]
max_nb_spikes = 2
spike_amplitude = 100
# reduce the noise - higher value = less noise
spike_rate = 10

[Binomial_Encoder]
max_nb_spikes = 2
spike_amplitude = 100
# higher value = less noise
reduce_noise = 1


[Rate_Encoder]
spike_amplitude = 100

[Latency_Encoder]
spike_amplitude = 100

[Rate_Decoder]
# (eg if run_time = 50 and nb_neurons_per_categories = 10 and ratio_max_output_spike = 0.20 
# so formula is (run_time*nb_neurons_per_categories*ratio_max_output_spike)/nb_neurons_per_categories 
# then each categorie output neuron can spike (or will be considered) 50*10*0.20 = 100 times or (50*10*0.20)/10 = 10 spikes per neuron category for 50 time steps)
ratio_max_output_spike = 1.0

[Voltage_Decoder]
disable_output_threshold = False
# applied only if disable_output_threshold = True
# otherwise it will be the threshold and reset_voltage of the output neurons
voltage_max = 1.0
voltage_min = 0.0

[Combinatorial_Encoder]
spike_amplitude = 100
# Will divide the number of combinaison by this number but will increase the number of spike per combinaison
# so improve the meaning of combinaison but decrease the number of combinaison
# number of comibinaison is -> 2^(run_time/combinatorial_factor)[:combinatorial_combinaison_size]
# has to be integer and > 0
combinatorial_factor = 1
combinatorial_combinaison_size_max=4e6
combinatorial_combinaison_size=4e6
combinatorial_combinaison_noise=0.0
combinatorial_combinaison_noise_decay=0.0
combinatorial_roll = False

# binary or energy or modulo_static or modulo_dynamic or modulo_energy_static or modulo_energy_dynamic, modulo_static_dynamic or modulo_energy_static_dynamic
# combinatorial_filter = binary
# combinatorial_filter = energy
# combinatorial_filter = modulo_static
combinatorial_filter = number_ones
# combinatorial_filter = modulo_dynamic_static
# combinatorial_filter = modulo_energy_static_dynamic
# has to be >= 1.0; used only with modulo_energy_static
combinatorial_modulo = 1.0
# a noise value which ocillate between -1 and 1 and added to the modulo value
combinatorial_ocillator_noise = 0.000
combinatorial_ocillator_noise_decay = 0.0
combinatorial_print_table_debug = False


[Augmented_Decoder]
spike_max = 200
spike_distribution_run = 100
spike_distribution_importance = 100
# If True augemented on All neurons, if False only on Output neurons
is_all_neurons_to_decode = True
# If True, update the voltage with the augmented spike value; otherwise, use the original spike value
is_neurons_update_with_augmented = False
# Reset voltage to 0 if the neuron spiked; otherwise, keep the excess voltage above the threshold
is_voltage_reset = True
# normalize the spike distribution between 0 and 1 -> np.clip((nb_spikes/spike_max), 0, 1)
is_normalize = True
# interpolate the spike distribution between min and max
is_interpolate = False
interpolate_max = 1.0
interpolate_min = 0.0
# positive, absolute, raw (positive and negative)
spike_type = positive
# first_index, by_index, nothing 
importance_type = by_index
# ascending, descending
linear_spike_importance_type = descending


[NEURO_EVOLUTION]
verbose = minimal
# maximize, minimize or closest_to_zero
optimization_type = maximize
algo_name = ENERGY_Len4_expSlow20_FOURIER_LAYER_RECURRENT


[Record]
criteria=fitness
sorted_by=fitness

[Genome_NN]
inputs = 784
hiddens = H1:32
# hiddens = H1:200, H2:200
# hiddens = H1:100, H2:100, H3:100
outputs = 10
inputs_multiplicator = 1
hiddens_multiplicator = 1
outputs_multiplicator = 1

is_self_neuron_connection = True

# architecture = I->H1, H1->O
# architecture = I->H1, H1->H2, H2->H3, H3->O
# architecture = I->H1, H1->H2, H2->O
architecture = I->H1, I->O, H1->H1, H1->O, O->H1, O->O
# architecture = I->I, I->H1, I->O, H1->I, H1->H1, H1->O, O->I, O->H1, O->O
# architecture = I->H1, I->H2, I->O, I->I, H1->O, H1->H1, H1->H2, H1->I, H2->O, H2->H1, H2->H2, H2->I, O->O, O->I, O->H1, O->H2
network_type = SNN
is_dynamic_topology = False


[NES]
