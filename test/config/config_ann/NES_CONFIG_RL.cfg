[Runner_Info]
runner_type = Reinforcement

# abs or raw or abs_scaling_1..3 or raw_scaling_1..3 or abs_scaling_dynamic_1..3 or raw_scaling_dynamic_1..3
# observation_type = raw_scaling
observation_type = abs_scaling_dynamic_3
neuron_model = ANN


action_type = static
# action_type = dynamic_evolution
# action_type = dynamic_evolution_abs
# action_type = dynamic_population
# action_type = dynamic_elites_1.0
# action_type = dynamic_population_evolution
# action_type = dynamic_population_evolution_abs
# action_type = dynamic_elite_evolution_0.50
# action_type = dynamic_elite_evolution_abs_0.50

# Set percentage limits [0, 1] of the env is full range (e.g., 0.75 * [-1, 1] (min_action, max_action) -> [-0.75, 0.75] of the full action range will be use).
# action_max_ratio =  0.05
# action_min_ratio =  0.05
action_max_ratio =  1.0
action_min_ratio =  1.0

[NEURO_EVOLUTION]
# True or False or minimal
verbose = True
# maximize, minimize or closest_to_zero
optimization_type = maximize
algo_name = NES-evosax

[Record]
criteria=best_episode_raw_score mean_episode_raw_score
sorted_by=best_episode_raw_score

[Genome_NN]
inputs = 17
hiddens = H1:32
outputs = 6
inputs_multiplicator = 1
hiddens_multiplicator = 1
outputs_multiplicator = 1

is_self_neuron_connection = True

forward = I->(H1_quant256), H1->O_quant128
# forward = I->(H1_relu_norm), (I, H1)_tanh_norm->O_tanh
# forward = I->(H1_relu_norm), H1->(H2_relu_norm), H2->O_tanh
# forward = I->(H1_relu_norm), H1->(H2_relu_norm), H2->(H3_relu_norm), H3->O_tanh
# forward = I->(H1_relu,O_tanh), H1->(H1_relu,O_tanh), O->(H1_relu, O_tanh)
# forward = (H1, H2_prev)_tanh_norm->(H1_norm_sigmoid, H2_relu), (H1,H2)_norm_relu->O, O_tanh
# forward = (H1, H2_prev)_tanh_norm->H1, (H1,H2)_norm_relu->O, O_tanh

architecture = I->H1, H1->O
# architecture = I->H1, H1->H2, H2->O
# architecture = I->H1, H1->H2, H2->H3, H3->O
# architecture = I->H1, I->O, H1->H1, H1->O, O->H1, O->O
# architecture = I->I, I->H1, I->O, H1->I, H1->H1, H1->O, O->I, O->H1, O->O
network_type = ANN
is_dynamic_topology = False

[NES]
pop_size = 128
verbose = False
params_to_update = weight

sigma_init = 0.2
# sigma_init = 1.2
# sigma_init = 0.01
temperature = 0.0
mean_decay = 0.0



[weight_synapse_parameter]
max = 0.0
min = 0.0

mu = 0.0
mu_max = 0.0
mu_min = 0.0

sigma = 0.0
sigma_max = 0.0
sigma_min = 0.0
sigma_decay = 1.0

